name: Release opencode-ascendant

on:
  push:
    tags:
      - "opencode-ascendant-v*"
  workflow_dispatch:

# id-token enables npm OIDC trusted publishing (configure the trusted
# publisher for opencode-ascendant on npmjs.com first). If NPM_TOKEN is set
# as a repo secret, npm publish uses it instead; either path works.
# NPM_TOKEN must be an Automation (or granular) token: classic Publish
# tokens on a 2FA-enabled account fail with EOTP, which cannot be answered
# in CI. The npm upgrade below is required for the OIDC path
# (trusted publishing needs npm >= 11.5.1; stock Node 22 ships npm 10).
# contents: write lets the job create the GitHub Release for the tag.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Rebuild package from sources
        run: node scripts/build-opencode-plugin.mjs

      - name: Tag matches stamped version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#opencode-ascendant-v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package $PKG"; exit 1; }
        working-directory: packages/opencode-ascendant

      - name: Install package dependencies
        run: bun install
        working-directory: packages/opencode-ascendant

      - name: Verify packed files
        run: bun pm pack --dry-run
        working-directory: packages/opencode-ascendant

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # Both publish steps skip a version that is already on npm, so a
      # re-run after a partial failure only publishes what is missing.
      - name: Publish to npm
        working-directory: packages/opencode-ascendant
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "opencode-ascendant@$VERSION" version >/dev/null 2>&1; then
            echo "opencode-ascendant@$VERSION already published"
          else
            npm publish --provenance --access public
          fi

      # ascendant-skills (the `npx ascendant-skills install` CLI) shares the
      # root version, so the same tag publishes it.
      - name: Publish ascendant-skills to npm
        working-directory: packages/ascendant-skills
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "ascendant-skills@$VERSION" version >/dev/null 2>&1; then
            echo "ascendant-skills@$VERSION already published"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
